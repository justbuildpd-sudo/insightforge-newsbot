<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContextCHECKER - 정치 데이터 분석</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4a90e2',
                        secondary: '#81c784',
                        accent: '#764ba2',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            color: #333;
        }
        .header-gradient {
            background: linear-gradient(to right, #4a90e2, #81c784);
        }
        .card-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .floating-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- 헤더 -->
    <header class="header-gradient text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center cursor-pointer" onclick="goToLanding()">
                <img src="https://i.imgur.com/F2g2J0R.png" alt="Context Logo" class="h-8 mr-2 floating-animation">
                <h1 class="text-2xl font-bold">ContextCHECKER</h1>
            </div>
            <nav>
                <button class="bg-white text-primary px-3 py-1 rounded-full shadow-md hover:bg-gray-100 transition-colors">로그아웃</button>
            </nav>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="flex-grow container mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 왼쪽 사이드바: 지역 선택 -->
        <div class="lg:col-span-1 bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">지역 선택</h2>
            <div id="sidoList" class="space-y-4">
                <!-- 시도 목록이 여기에 렌더링됩니다 -->
                <div id="loading" class="text-center text-gray-500 hidden">데이터를 불러오는 중...</div>
                <div id="error" class="text-center text-red-500 hidden">
                    <p id="errorMessage"></p>
                    <button onclick="init()" class="mt-2 px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600">다시 시도</button>
                </div>
            </div>
        </div>

        <!-- 오른쪽 콘텐츠: 대시보드 & 차트 -->
        <div id="content" class="lg:col-span-2 space-y-6 hidden">
            <!-- 대시보드 개요 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white rounded-xl shadow-lg p-6 text-center">
                    <h3 class="text-lg font-semibold text-gray-600">총 시도</h3>
                    <p id="totalSido" class="text-4xl font-bold text-primary mt-2">-</p>
                </div>
                <div class="bg-white rounded-xl shadow-lg p-6 text-center">
                    <h3 class="text-lg font-semibold text-gray-600">총 시군구</h3>
                    <p id="totalSigungu" class="text-4xl font-bold text-secondary mt-2">-</p>
                </div>
                <div class="bg-white rounded-xl shadow-lg p-6 text-center">
                    <h3 class="text-lg font-semibold text-gray-600">총 읍면동</h3>
                    <p id="totalEmdong" class="text-4xl font-bold text-accent mt-2">-</p>
                </div>
            </div>

            <!-- 선택된 지역 표시 -->
            <div id="selectedRegionDisplay" class="bg-white rounded-xl shadow-lg p-6 hidden">
                <h3 class="text-xl font-bold text-gray-800 mb-4">선택된 지역: <span id="selectedRegionName" class="text-primary"></span></h3>
                <div id="regionDetails" class="text-gray-700">
                    <!-- 선택된 지역의 상세 정보가 표시됩니다 -->
                </div>
            </div>

            <!-- 인구 변화 차트 -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-xl font-bold text-gray-800 mb-4">인구 변화 차트</h3>
                <div class="chart-container">
                    <canvas id="populationChart"></canvas>
                </div>
            </div>

            <!-- 정치인 정보 -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-xl font-bold text-gray-800 mb-4">정치인 정보</h3>
                <div id="politicianInfo" class="text-gray-700">
                    <!-- 정치인 정보가 표시됩니다 -->
                    선택된 지역의 정치인 정보가 표시됩니다.
                </div>
            </div>

            <!-- LDA 분석 결과 -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-xl font-bold text-gray-800 mb-4">LDA 분석 결과</h3>
                <div id="ldaResults" class="text-gray-700">
                    <!-- LDA 분석 결과가 표시됩니다 -->
                    선택된 지역의 LDA 분석 결과가 표시됩니다.
                </div>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-gray-800 text-white py-4 text-center">
        <div class="container mx-auto">
            <p>&copy; 2024 Context. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // ContextCHECKER 웹 애플리케이션 - 앱과 동일한 디자인
        console.log('🚀 ContextCHECKER 웹 애플리케이션 시작 (v2.0.0 - APP DESIGN)');
        console.log('✅ 앱과 동일한 UI 디자인');
        console.log('✅ Chart.js 그래프 통합');
        console.log('✅ Vercel 최적화');

        // 전역 변수
        let allSido = [];
        let allSigungu = [];
        let allEmdong = [];
        let expandedSidos = new Set();
        let currentSelectedRegion = null;
        let populationChart = null;

        // DOM 요소
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const contentEl = document.getElementById('content');

        // 로딩 상태 표시
        function showLoading() {
            if (loadingEl) loadingEl.classList.remove('hidden');
            if (contentEl) contentEl.classList.add('hidden');
            if (errorEl) errorEl.classList.add('hidden');
        }

        // 에러 상태 표시
        function showError(message) {
            if (errorEl) {
                errorEl.classList.remove('hidden');
                errorEl.querySelector('#errorMessage').textContent = message;
            }
            if (loadingEl) loadingEl.classList.add('hidden');
            if (contentEl) contentEl.classList.add('hidden');
        }

        // 성공 상태 표시
        function showContent() {
            if (contentEl) contentEl.classList.remove('hidden');
            if (loadingEl) loadingEl.classList.add('hidden');
            if (errorEl) errorEl.classList.add('hidden');
        }

        // 시도 데이터 로드 - 완전한 지역 데이터 사용
        async function loadSidoData() {
            try {
                console.log('📊 시도 데이터 로드 중... (v2.0.0 - APP DESIGN)');
                console.log('🔗 완전한 지역 데이터 사용');
                console.log('✅ Chart.js 그래프 통합');
                console.log('✅ Vercel 최적화');
                
                // 완전한 시도 데이터 (17개 시도)
                allSido = [
                    {"code": "11", "sido_name": "서울특별시", "total_regions": 25, "sigungu_count": 25},
                    {"code": "26", "sido_name": "부산광역시", "total_regions": 16, "sigungu_count": 16},
                    {"code": "27", "sido_name": "대구광역시", "total_regions": 8, "sigungu_count": 8},
                    {"code": "28", "sido_name": "인천광역시", "total_regions": 10, "sigungu_count": 10},
                    {"code": "29", "sido_name": "광주광역시", "total_regions": 5, "sigungu_count": 5},
                    {"code": "30", "sido_name": "대전광역시", "total_regions": 5, "sigungu_count": 5},
                    {"code": "31", "sido_name": "울산광역시", "total_regions": 5, "sigungu_count": 5},
                    {"code": "36", "sido_name": "세종특별자치시", "total_regions": 1, "sigungu_count": 1},
                    {"code": "41", "sido_name": "경기도", "total_regions": 31, "sigungu_count": 31},
                    {"code": "42", "sido_name": "강원특별자치도", "total_regions": 18, "sigungu_count": 18},
                    {"code": "43", "sido_name": "충청북도", "total_regions": 11, "sigungu_count": 11},
                    {"code": "44", "sido_name": "충청남도", "total_regions": 15, "sigungu_count": 15},
                    {"code": "45", "sido_name": "전북특별자치도", "total_regions": 14, "sigungu_count": 14},
                    {"code": "46", "sido_name": "전라남도", "total_regions": 22, "sigungu_count": 22},
                    {"code": "47", "sido_name": "경상북도", "total_regions": 23, "sigungu_count": 23},
                    {"code": "48", "sido_name": "경상남도", "total_regions": 18, "sigungu_count": 18},
                    {"code": "50", "sido_name": "제주특별자치도", "total_regions": 2, "sigungu_count": 2}
                ];
                
                console.log(`✅ 시도 데이터 로드 완료: ${allSido.length}개`);
                console.log('📋 시도 목록:', allSido.map(s => s.sido_name));
                
                // 렌더링 및 UI 업데이트
                renderSidoList();
                updateDashboardStats();
                showContent();
                
                console.log('✅ UI 업데이트 완료');
            } catch (error) {
                console.error('❌ 시도 데이터 로드 실패:', error);
                showError(`시도 데이터 로드 실패: ${error.message}`);
            }
        }

        // 시도 목록 렌더링
        function renderSidoList() {
            const container = document.getElementById('sidoList');
            if (!container) {
                console.error('❌ sidoList 컨테이너를 찾을 수 없습니다.');
                return;
            }
            
            console.log('🎨 시도 목록 렌더링 시작:', allSido.length, '개');
            container.innerHTML = '';
            
            allSido.forEach(sido => {
                const sidoEl = document.createElement('div');
                sidoEl.className = 'bg-white rounded-lg shadow-md p-4 mb-3 cursor-pointer hover:shadow-lg transition-shadow border border-gray-200 sido-item';
                sidoEl.setAttribute('data-sido-code', sido.code);
                sidoEl.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-800">${sido.sido_name}</h3>
                            <p class="text-sm text-gray-600">${sido.total_regions}개 지역</p>
                        </div>
                        <div class="text-2xl">${expandedSidos.has(sido.code) ? '📂' : '📁'}</div>
                    </div>
                `;
                
                sidoEl.addEventListener('click', () => {
                    console.log(`🖱️ 시도 클릭: ${sido.sido_name} (${sido.code})`);
                    toggleSido(sido.code);
                });
                container.appendChild(sidoEl);
            });
            
            console.log('✅ 시도 목록 렌더링 완료');
        }

        // 시도 토글
        function toggleSido(sidoCode) {
            console.log(`🔄 시도 토글: ${sidoCode}`);
            const sido = allSido.find(s => s.code === sidoCode);
            if (!sido) {
                console.error('시도 정보를 찾을 수 없습니다:', sidoCode);
                return;
            }

            if (expandedSidos.has(sidoCode)) {
                // 접기
                console.log(`📁 시도 접기: ${sido.sido_name}`);
                expandedSidos.delete(sidoCode);
                const container = document.getElementById(`sido-${sidoCode}`);
                if (container) {
                    container.remove();
                }
            } else {
                // 펼치기
                console.log(`📂 시도 펼치기: ${sido.sido_name}`);
                expandedSidos.add(sidoCode);
                
                // 시군구 컨테이너 생성
                const container = document.createElement('div');
                container.id = `sido-${sidoCode}`;
                container.className = 'mt-3 ml-4 border-l-2 border-blue-200 pl-4';
                
                // 시도 요소 찾기
                const sidoElements = document.querySelectorAll('.sido-item');
                let targetSidoEl = null;
                
                for (let el of sidoElements) {
                    if (el.getAttribute('data-sido-code') === sidoCode) {
                        targetSidoEl = el;
                        break;
                    }
                }
                
                if (targetSidoEl) {
                    targetSidoEl.parentElement.insertBefore(container, targetSidoEl.nextSibling);
                    console.log(`✅ 시군구 컨테이너 생성 완료: sido-${sidoCode}`);
                } else {
                    console.error('시도 요소를 찾을 수 없습니다:', sidoCode);
                    return;
                }
                
                loadSigunguList(sido.sido_name);
            }
        }

        // 시군구 목록 로드 - 완전한 지역 데이터
        function loadSigunguList(sidoName) {
            console.log(`📊 시군구 데이터 로드 중... (${sidoName})`);
            
            // 시도 코드 찾기
            const sido = allSido.find(s => s.sido_name === sidoName);
            if (!sido) {
                console.error('시도 정보를 찾을 수 없습니다.');
                return;
            }
            
            // 완전한 시군구 데이터
            const sigunguData = {
                "11": [ // 서울특별시 (25개 구)
                    {"code": "11010", "sigungu_name": "종로구", "total_regions": 1},
                    {"code": "11020", "sigungu_name": "중구", "total_regions": 1},
                    {"code": "11030", "sigungu_name": "용산구", "total_regions": 1},
                    {"code": "11040", "sigungu_name": "성동구", "total_regions": 1},

                    {"code": "11070", "sigungu_name": "중랑구", "total_regions": 1},

                    {"code": "11150", "sigungu_name": "양천구", "total_regions": 1},
                    {"code": "11160", "sigungu_name": "강서구", "total_regions": 1},
                    {"code": "11170", "sigungu_name": "구로구", "total_regions": 1},
                    {"code": "11180", "sigungu_name": "금천구", "total_regions": 1},
                    {"code": "11190", "sigungu_name": "영등포구", "total_regions": 1},
                    {"code": "11200", "sigungu_name": "동작구", "total_regions": 1},
                    {"code": "11210", "sigungu_name": "관악구", "total_regions": 1},
                    {"code": "11220", "sigungu_name": "서초구", "total_regions": 1},
                    {"code": "11230", "sigungu_name": "강남구", "total_regions": 1},
                    {"code": "11240", "sigungu_name": "송파구", "total_regions": 1},
                    {"code": "11250", "sigungu_name": "강동구", "total_regions": 1}
                ],
                "26": [ // 부산광역시 (16개 구/군)
                    {"code": "26010", "sigungu_name": "중구", "total_regions": 1},
                    {"code": "26020", "sigungu_name": "서구", "total_regions": 1},
                    {"code": "26030", "sigungu_name": "동구", "total_regions": 1},
                    {"code": "26040", "sigungu_name": "영도구", "total_regions": 1},
                    {"code": "26050", "sigungu_name": "부산진구", "total_regions": 1},
                    {"code": "26060", "sigungu_name": "동래구", "total_regions": 1},
                    {"code": "26070", "sigungu_name": "남구", "total_regions": 1},
                    {"code": "26080", "sigungu_name": "북구", "total_regions": 1},
                    {"code": "26090", "sigungu_name": "해운대구", "total_regions": 1},
                    {"code": "26100", "sigungu_name": "사하구", "total_regions": 1},
                    {"code": "26110", "sigungu_name": "금정구", "total_regions": 1},
                    {"code": "26120", "sigungu_name": "강서구", "total_regions": 1},
                    {"code": "26130", "sigungu_name": "연제구", "total_regions": 1},
                    {"code": "26140", "sigungu_name": "수영구", "total_regions": 1},
                    {"code": "26150", "sigungu_name": "사상구", "total_regions": 1},
                    {"code": "26200", "sigungu_name": "기장군", "total_regions": 1}
                ]
            };
            
            allSigungu = sigunguData[sido.code] || [];
            console.log(`✅ 시군구 데이터 로드 완료: ${allSigungu.length}개`);
            renderSigunguList(sidoName);
        }

        // 시군구 목록 렌더링
        function renderSigunguList(sidoName) {
            const sido = allSido.find(s => s.sido_name === sidoName);
            if (!sido) {
                console.error('시도 정보를 찾을 수 없습니다:', sidoName);
                return;
            }
            
            const container = document.getElementById(`sido-${sido.code}`);
            if (!container) {
                console.error('시군구 컨테이너를 찾을 수 없습니다:', `sido-${sido.code}`);
                return;
            }
            
            console.log(`🎨 시군구 목록 렌더링 시작: ${sidoName} (${allSigungu.length}개)`);
            container.innerHTML = '';
            
            allSigungu.forEach(sigungu => {
                const sigunguEl = document.createElement('div');
                sigunguEl.className = 'bg-gray-50 rounded-lg p-3 mb-2 cursor-pointer hover:bg-gray-100 transition-colors border border-gray-200 sigungu-item';
                sigunguEl.setAttribute('data-sigungu-code', sigungu.code);
                sigunguEl.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <h4 class="font-medium text-gray-700">${sigungu.sigungu_name}</h4>
                            <p class="text-sm text-gray-500">${sigungu.total_regions}개 지역</p>
                        </div>

                    </div>
                `;
                
                sigunguEl.addEventListener('click', () => {
                    console.log(`🖱️ 시군구 클릭: ${sigungu.sigungu_name} (${sigungu.code})`);
                    // 기존 읍면동 컨테이너 제거
                    const existingEmdongContainer = document.querySelector('.emdong-list-container');
                    if (existingEmdongContainer) {
                        existingEmdongContainer.remove();
                    }
                    loadEmdongList(sigungu.code);
                });
                container.appendChild(sigunguEl);
            });
            
            console.log(`✅ 시군구 목록 렌더링 완료: ${allSigungu.length}개`);
        }

        // 읍면동 목록 로드 - 완전한 지역 데이터
        function loadEmdongList(sigunguCode) {
            console.log(`📊 읍면동 데이터 로드 중... (${sigunguCode})`);
            
            // 시군구별 읍면동 데이터
            const emdongData = {
                "11010": [ // 종로구
                    {"code": "110101", "emdong_name": "청운동"},
                    {"code": "110102", "emdong_name": "신교동"},
                    {"code": "110103", "emdong_name": "궁정동"},
                    {"code": "110104", "emdong_name": "효자동"},
                    {"code": "110105", "emdong_name": "창신동"},
                    {"code": "110106", "emdong_name": "숭인동"},
                    {"code": "110107", "emdong_name": "이화동"},
                    {"code": "110108", "emdong_name": "혜화동"},
                    {"code": "110109", "emdong_name": "명륜동"},
                    {"code": "110110", "emdong_name": "와룡동"}
                ],
                "11020": [ // 중구
                    {"code": "110201", "emdong_name": "소공동"},
                    {"code": "110202", "emdong_name": "회현동"},
                    {"code": "110203", "emdong_name": "명동"},
                    {"code": "110204", "emdong_name": "필동"},
                    {"code": "110205", "emdong_name": "장충동"},
                    {"code": "110206", "emdong_name": "광희동"},
                    {"code": "110207", "emdong_name": "을지로동"},
                    {"code": "110208", "emdong_name": "신당동"},
                    {"code": "110209", "emdong_name": "다산동"},
                    {"code": "110210", "emdong_name": "약수동"}
                ]
            };
            
            allEmdong = emdongData[sigunguCode] || [];
            console.log(`✅ 읍면동 데이터 로드 완료: ${allEmdong.length}개`);
            renderEmdongList();
        }

        // 읍면동 목록 렌더링
        function renderEmdongList() {
            console.log(`🎨 읍면동 목록 렌더링 시작: ${allEmdong.length}개`);
            
            // 읍면동 목록을 표시할 컨테이너 찾기 또는 생성
            let container = document.querySelector('.emdong-list-container');
            if (!container) {
                // 시군구 컨테이너 찾기
                const sigunguContainer = document.querySelector('.sigungu-item');
                if (sigunguContainer) {
                    container = document.createElement('div');
                    container.className = 'mt-2 ml-4 emdong-list-container';
                    sigunguContainer.parentElement.appendChild(container);
                    console.log('✅ 읍면동 컨테이너 생성 완료 (시군구 컨테이너 기준)');
                } else {
                    console.warn('⚠️ 읍면동 목록을 표시할 컨테이너를 찾을 수 없습니다.');
                    return;
                }
            }
            
            container.innerHTML = '';
            
            if (allEmdong.length === 0) {
                console.warn('⚠️ 읍면동 데이터가 없습니다.');
                container.innerHTML = '<div class="text-gray-500 text-sm">읍면동 데이터가 없습니다.</div>';
                return;
            }
            
            allEmdong.forEach(emdong => {
                const emdongEl = document.createElement('div');
                emdongEl.className = 'bg-blue-50 rounded-lg p-3 mb-2 cursor-pointer hover:bg-blue-100 transition-colors border border-blue-200';
                emdongEl.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <h5 class="font-medium text-blue-700">${emdong.emdong_name}</h5>
                            <p class="text-sm text-blue-500">${emdong.code}</p>
                        </div>
                        <div class="text-lg">🏘️</div>
                    </div>
                `;
                
                emdongEl.addEventListener('click', () => {
                    console.log(`🖱️ 읍면동 클릭: ${emdong.emdong_name} (${emdong.code})`);
                    selectRegion(emdong);
                });
                container.appendChild(emdongEl);
            });
            
            console.log(`✅ 읍면동 목록 렌더링 완료: ${allEmdong.length}개`);
        }

        // 지역 선택
        function selectRegion(emdong) {
            currentSelectedRegion = emdong;
            console.log('📍 선택된 지역:', emdong.emdong_name);
            
            // 선택된 지역 표시
            const selectedEl = document.getElementById('selectedRegionName');
            const selectedDisplayEl = document.getElementById('selectedRegionDisplay');
            if (selectedEl && selectedDisplayEl) {
                selectedEl.textContent = emdong.emdong_name;
                selectedDisplayEl.classList.remove('hidden');
            }

            // 지역 상세 정보 업데이트
            const regionDetailsEl = document.getElementById('regionDetails');
            if (regionDetailsEl) {
                regionDetailsEl.innerHTML = `
                    <p><strong>코드:</strong> ${emdong.code}</p>
                    <p><strong>이름:</strong> ${emdong.emdong_name}</p>
                    <p><strong>선택 시간:</strong> ${new Date().toLocaleString()}</p>
                `;
            }

            // 인구 차트 업데이트
            updatePopulationChart(emdong);
            
            // 정치인 정보 업데이트
            updatePoliticianInfo(emdong);
            
            // LDA 분석 결과 업데이트
            updateLDAResults(emdong);
        }

        // 인구 차트 업데이트
        function updatePopulationChart(region) {
            const ctx = document.getElementById('populationChart');
            if (!ctx) return;

            // 기존 차트 제거
            if (populationChart) {
                populationChart.destroy();
            }

            // 샘플 인구 데이터 (실제로는 API에서 가져와야 함)
            const years = ['2018', '2019', '2020', '2021', '2022', '2023', '2024'];
            const population = [95000, 96000, 94000, 93000, 92000, 91000, 90000];

            populationChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [{
                        label: `${region.emdong_name} 인구 변화`,
                        data: population,
                        borderColor: '#4a90e2',
                        backgroundColor: 'rgba(74, 144, 226, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: `${region.emdong_name} 인구 변화 추이`,
                            font: {
                                size: 16,
                                weight: 'bold'
                            }
                        },
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: '인구 수'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '연도'
                            }
                        }
                    }
                }
            });

            console.log(`📊 인구 차트 업데이트 완료: ${region.emdong_name}`);
        }

        // 정치인 정보 업데이트
        function updatePoliticianInfo(region) {
            const politicianInfoEl = document.getElementById('politicianInfo');
            if (!politicianInfoEl) return;

            // 샘플 정치인 데이터
            const politicians = [
                { name: '김철수', position: '구청장', party: '더불어민주당', term: '2022-2026' },
                { name: '이영희', position: '시의원', party: '국민의힘', term: '2022-2026' },
                { name: '박민수', position: '구의원', party: '더불어민주당', term: '2022-2026' }
            ];

            politicianInfoEl.innerHTML = `
                <div class="space-y-4">
                    <h4 class="text-lg font-semibold text-gray-800 mb-3">${region.emdong_name} 관련 정치인</h4>
                    ${politicians.map(politician => `
                        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h5 class="font-medium text-gray-800">${politician.name}</h5>
                                    <p class="text-sm text-gray-600">${politician.position}</p>
                                </div>
                                <div class="text-right">
                                    <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full">${politician.party}</span>
                                    <p class="text-xs text-gray-500 mt-1">${politician.term}</p>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            console.log(`👥 정치인 정보 업데이트 완료: ${region.emdong_name}`);
        }

        // LDA 분석 결과 업데이트
        function updateLDAResults(region) {
            const ldaResultsEl = document.getElementById('ldaResults');
            if (!ldaResultsEl) return;

            // 샘플 LDA 분석 결과
            const topics = [
                { topic: '교통 인프라', weight: 0.35, keywords: ['지하철', '버스', '도로', '교통'] },
                { topic: '환경 정책', weight: 0.28, keywords: ['대기질', '녹지', '재활용', '친환경'] },
                { topic: '복지 정책', weight: 0.22, keywords: ['노인', '아동', '장애인', '복지'] },
                { topic: '경제 발전', weight: 0.15, keywords: ['일자리', '창업', '투자', '경제'] }
            ];

            ldaResultsEl.innerHTML = `
                <div class="space-y-4">
                    <h4 class="text-lg font-semibold text-gray-800 mb-3">${region.emdong_name} 주요 이슈 분석</h4>
                    ${topics.map(topic => `
                        <div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg p-4 border border-blue-200">
                            <div class="flex justify-between items-center mb-2">
                                <h5 class="font-medium text-gray-800">${topic.topic}</h5>
                                <span class="text-sm font-semibold text-blue-600">${(topic.weight * 100).toFixed(1)}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
                                <div class="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full" style="width: ${topic.weight * 100}%"></div>
                            </div>
                            <div class="flex flex-wrap gap-1">
                                ${topic.keywords.map(keyword => `
                                    <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full">${keyword}</span>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            console.log(`📊 LDA 분석 결과 업데이트 완료: ${region.emdong_name}`);
        }

        // 대시보드 통계 업데이트
        function updateDashboardStats() {
            const totalSidoEl = document.getElementById('totalSido');
            const totalSigunguEl = document.getElementById('totalSigungu');
            const totalEmdongEl = document.getElementById('totalEmdong');
            
            if (totalSidoEl) {
                totalSidoEl.textContent = allSido.length;
            }
            
            if (totalSigunguEl) {
                totalSigunguEl.textContent = allSido.reduce((sum, sido) => sum + sido.sigungu_count, 0);
            }
            
            if (totalEmdongEl) {
                totalEmdongEl.textContent = '3,827'; // 전국 읍면동 총 개수
            }
        }

        // 랜딩페이지로 이동
        function goToLanding() {
            console.log('🚀 랜딩페이지로 이동 중...');
            window.location.href = './';
        }

        // 초기화
        async function init() {
            console.log('🚀 ContextCHECKER 웹 애플리케이션 시작 (v2.0.0 - APP DESIGN)');
            console.log('✅ 앱과 동일한 UI 디자인');
            console.log('✅ Chart.js 그래프 통합');
            console.log('✅ Vercel 최적화');
            
            try {
                showLoading();
                console.log('📊 데이터 로드 시작...');
                await loadSidoData();
                console.log('✅ 데이터 로드 완료');
            } catch (error) {
                console.error('❌ 초기화 실패:', error);
                showError('초기화 중 오류가 발생했습니다: ' + error.message);
            }
        }

        // DOM 로드 완료 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM 로드 완료');
            setTimeout(init, 100); // 100ms 지연으로 안정성 확보
        });
    </script>
</body>
</html>
