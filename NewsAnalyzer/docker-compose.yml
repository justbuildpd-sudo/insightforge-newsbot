version: '3.8'

services:
  # 과거 데이터 수집 (2008-2025, 매일 자동)
  newsanalyzer-historical:
    build: .
    container_name: newsanalyzer-historical
    restart: unless-stopped
    
    volumes:
      # 데이터 영속성
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    
    environment:
      - TZ=Asia/Seoul
      - COLLECTION_MODE=historical
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-ULDLTGiPvrrPBgbuydSm}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET:-uO5mu7UQBg}
    
    networks:
      - newsanalyzer-network
  
  # 일일 수집 및 LDA 분석 (현재 뉴스)
  newsanalyzer-daily:
    build: .
    container_name: newsanalyzer-daily
    restart: unless-stopped
    
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ../insightforge-web/data:/app/insightforge-data
    
    environment:
      - TZ=Asia/Seoul
      - COLLECTION_MODE=daily
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-ULDLTGiPvrrPBgbuydSm}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET:-uO5mu7UQBg}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - VERCEL_TOKEN=${VERCEL_TOKEN}
    
    networks:
      - newsanalyzer-network

networks:
  newsanalyzer-network:
    driver: bridge

