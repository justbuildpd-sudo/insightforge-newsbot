version: '3.8'

services:
  newsanalyzer:
    build: .
    container_name: newsanalyzer
    restart: unless-stopped
    
    volumes:
      # 데이터 영속성
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      # InsightForge 데이터 연결 (업데이트용)
      - ../insightforge-web/data:/app/insightforge-data
    
    environment:
      - TZ=Asia/Seoul
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - VERCEL_TOKEN=${VERCEL_TOKEN}
    
    # 네트워크 (필요시)
    networks:
      - newsanalyzer-network

networks:
  newsanalyzer-network:
    driver: bridge

