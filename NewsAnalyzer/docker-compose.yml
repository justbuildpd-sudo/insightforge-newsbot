version: '3.8'

services:
  # 다중 API를 사용한 과거 데이터 수집 (2008-2025, 하루 종일)
  newsanalyzer-historical:
    build: .
    container_name: newsanalyzer-historical
    restart: unless-stopped
    
    volumes:
      # 데이터 영속성
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./multi_api_config.json:/app/multi_api_config.json
    
    environment:
      - TZ=Asia/Seoul
      - COLLECTION_MODE=enhanced_historical
      - MULTI_API_ENABLED=true
    
    networks:
      - newsanalyzer-network
  
  # API 관리 웹 서버
  api-management:
    build: .
    container_name: api-management
    restart: unless-stopped
    
    ports:
      - "5000:5000"
    
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./multi_api_config.json:/app/multi_api_config.json
      - ./templates:/app/templates
    
    environment:
      - TZ=Asia/Seoul
      - FLASK_ENV=production
    
    networks:
      - newsanalyzer-network
  
  # 일일 수집 및 LDA 분석 (현재 뉴스)
  newsanalyzer-daily:
    build: .
    container_name: newsanalyzer-daily
    restart: unless-stopped
    
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ../insightforge-web/data:/app/insightforge-data
      - ./multi_api_config.json:/app/multi_api_config.json
    
    environment:
      - TZ=Asia/Seoul
      - COLLECTION_MODE=daily
      - MULTI_API_ENABLED=true
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - VERCEL_TOKEN=${VERCEL_TOKEN}
    
    networks:
      - newsanalyzer-network

networks:
  newsanalyzer-network:
    driver: bridge

